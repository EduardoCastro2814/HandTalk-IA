<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HandTalk IA — Traducción de Lengua de Señas en Tiempo Real</title>
  <meta name="description" content="Interfaz web accesible y moderna para interpretar lengua de señas en tiempo real con Inteligencia Artificial.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./assets/logo.svg">
  
  <!-- Google Fonts - Inter for Stripe/Linear modern design -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Estilos principales -->
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>

  <!-- Contenedor Principal de la App -->
  <div class="app-container">
    
    <!-- Sección Superior: Header -->
    <header class="app-header">
      <div class="logo-container">
        <!-- Logotipo inline SVG para flexibilidad y carga rápida -->
        <svg class="app-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" aria-hidden="true">
          <!-- Burbuja de diálogo -->
          <path class="logo-bubble" d="M84 26C92.8366 26 100 33.1634 100 42C100 47.3908 97.3323 52.1583 93.2188 55.0567L95.5 64L86.1473 59.3236C85.4449 59.4379 84.7297 59.5 84 59.5C75.1634 59.5 68 52.3366 68 42C68 33.1634 75.1634 26 84 26Z" fill="#0F52BA" fill-opacity="0.12" stroke="#0F52BA" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Mano -->
          <path class="logo-hand" d="M36 94V70C36 70 20 64 20 54C20 44 32 46 36 54V24C36 20.5 39 18 42.5 18C46 18 49 20.5 49 24V48M49 24C49 20.5 52 18 55.5 18C59 18 62 20.5 62 24V48M62 26C62 22.5 65 20 68.5 20C72 20 75 22.5 75 26V50M75 32C75 29 78 27 81 27C84 27 87 29 87 32V66C87 81.5 75.5 94 60 94H36Z" stroke="#0F52BA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="app-title">HandTalk IA</h1>
      <p class="app-subtitle">Traducción de lengua de señas en tiempo real mediante inteligencia artificial.</p>
    </header>

    <!-- Sección Principal: Tarjeta Central -->
    <main class="app-main">
      <section class="card" aria-label="Área de traducción e interpretación">
        
        <!-- Área de la Cámara (Proporción 16:9) -->
        <div class="camera-container mirrored" id="cameraContainer">
          
          <!-- Elemento de Video -->
          <video id="webcamVideo" autoplay playsinline muted class="camera-video hidden" aria-label="Transmisión de video en vivo"></video>
          
          <!-- Lienzo de Superposición (Canvas para Landmarks) -->
          <canvas id="overlayCanvas" class="camera-canvas hidden" aria-hidden="true"></canvas>
          
          <!-- Capa de Estado y Mensajes (Placeholder) -->
          <div class="camera-placeholder" id="cameraPlaceholder" aria-live="polite">
            <div class="placeholder-icon-wrapper">
              <svg class="placeholder-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
              </svg>
            </div>
            <p class="placeholder-text" id="placeholderText">La cámara aparecerá aquí.</p>
          </div>

          <!-- Indicador de Estado de la Cámara (Cámara activa, etc.) -->
          <div class="camera-status-badge hidden" id="cameraStatusBadge" aria-live="polite">
            <span class="status-dot"></span>
            <span class="status-label" id="statusLabel">Cámara activa</span>
          </div>

          <!-- Indicador de Estado de la Mano (Mano detectada, etc.) -->
          <div class="hand-status-badge hidden" id="handStatusBadge" aria-live="polite">
            <span class="hand-status-dot"></span>
            <span class="hand-status-label" id="handStatusLabel">No se detecta mano</span>
          </div>
          
        </div>

        <!-- Botones de Control -->
        <div class="controls-wrapper">
          <button id="toggleCameraButton" class="btn btn-primary" aria-label="Iniciar cámara" aria-pressed="false">
            <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
            <span id="btnText">Iniciar cámara</span>
          </button>
          
          <button id="switchCameraButton" class="btn btn-secondary hidden" aria-label="Cambiar cámara">
            <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H18.2" />
            </svg>
            <span>Cambiar cámara</span>
          </button>
        </div>

        <!-- Área de Subtítulos -->
        <div class="subtitles-wrapper">
          <h2 class="subtitles-title">Traducción</h2>
          <div class="subtitles-container" id="subtitlesContainer" aria-live="assertive" aria-atomic="true">
            <p class="subtitles-text" id="subtitlesText">Esperando reconocimiento...</p>
          </div>
        </div>

      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p class="footer-brand">HandTalk IA</p>
      <p class="footer-version">Versión 0.2</p>
    </footer>

  </div>

  <!-- Lógica modular de JS -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
